<!doctype html><html lang="en"><head><meta charset="UTF-8"><title>Changed capacity means solving the allocation again</title></head><body><template><div id="replan" data-composition-id="replan" data-duration="15" class="scene" style="background:#ff6654;"><div class="eyebrow"><span class="mark">A / ANCHOR</span><span>WHEN A CONSTRAINT CHANGES</span><span>10 / 14</span></div><div class="words title" style="left:105px;top:155px;width:1710px;font-size:125px">LESS CAPACITY? SOLVE AGAIN.</div><div class="explanation setup" style="left:110px;top:300px;width:1600px">If D cannot cover the full gap, the previous mix must be reconsidered.</div><div class="card d-capacity" style="left:110px;top:440px;width:700px;height:360px;background:#fff3db"><div class="node-title">D / AVAILABLE CAPACITY</div><div class="capacity-track"><div class="capacity-fill"></div></div><div class="card-caption">Recorded capacity change: 650 → 450 units</div></div><div class="words arrow" style="left:880px;top:520px;width:170px;font-size:140px">→</div><div class="card new-plan" style="left:1110px;top:440px;width:700px;height:360px;background:#28dce9"><div class="node-title">RECOMPUTE THE MIX</div><div class="card-caption">New mix: inventory 350 + D 450 + E 200.</div><div class="card-caption">No feasible mix? Show the shortage.</div></div><div class="explanation result" style="left:110px;top:915px;width:1600px">The revised allocation must come from a fresh calculation, then be challenged again.</div><div class="foot"><span>SYNTHETIC NETWORK / ORDERS / INCIDENTS / SIMULATION ONLY</span><span>EDITORIAL / RECORDED CAPACITY CHANGE</span></div></div><script>(function(){const tl=gsap.timeline({paused:true});const base='#replan ';const A={pop(q,t,x=0,y=35,scale=.92){tl.fromTo(base+q,{x,y,opacity:0,scale},{x:0,y:0,opacity:1,scale:1,duration:.65,ease:'back.out(1.3)'},t)},count(q,n,t,d=1){tl.fromTo(base+q,{textContent:0},{textContent:n,snap:{textContent:1},duration:d,ease:'power2.out'},t)},draw(q,t,d=.7){document.querySelectorAll(base+q).forEach(p=>{const n=p.getTotalLength();tl.fromTo(p,{strokeDasharray:n,strokeDashoffset:n},{strokeDashoffset:0,duration:d,ease:'power2.out'},t)})}};A.pop('.title',.15,-100,0);A.pop('.setup',.5,0,25);A.pop('.d-capacity',1,-150,0);tl.fromTo(base+'.capacity-fill',{scaleX:1},{scaleX:450/650,duration:2,ease:'power2.inOut'},2.5);A.pop('.arrow',4.5,-70,0);A.pop('.new-plan',5.2,150,0);tl.to(base+'.new-plan',{rotation:1,duration:.2,yoyo:true,repeat:3},7);A.pop('.result',8.3,0,25);window.__timelines['replan']=tl;})();</script></template></body></html>
