d. It is not a universal guarantee.</div><div class="foot"><span>SYNTHETIC NETWORK / ORDERS / INCIDENTS / SIMULATION ONLY</span><span>WORKFLOW / RUN FOOTAGE PENDING</span></div></div><script>(function(){const tl=gsap.timeline({paused:true});const base='#stress ';const A={pop(q,t,x=0,y=35,scale=.92){tl.fromTo(base+q,{x,y,opacity:0,scale},{x:0,y:0,opacity:1,scale:1,duration:.65,ease:'back.out(1.3)'},t)},count(q,n,t,d=1){tl.fromTo(base+q,{textContent:0},{textContent:n,snap:{textContent:1},duration:d,ease:'power2.out'},t)},draw(q,t,d=.7){document.querySelectorAll(base+q).forEach(p=>{const n=p.getTotalLength();tl.fromTo(p,{strokeDasharray:n,strokeDashoffset:n},{strokeDashoffset:0,duration:d,ease:'power2.out'},t)})}};A.pop('.title',.15,-100,0);A.pop('.setup',.5,0,25);A.pop('.candidate',1,-100,0);A.draw('.stress-wire',2,1);A.pop('.case-one',3,120,0);A.pop('.case-two',5,120,0);tl.fromTo(base+'.test-packet',{x:0,y:0,opacity:0},{x:420,y:0,opacity:1,duration:1.15,stagger:.2,repeat:2,repeatDelay:.35,ease:'none'},3);tl.to(base+'.case-one',{backgroundColor:'#ff6654',duration:.5},7);A.pop('.response',8.1,0,45);A.pop('.limit',10.3,0,25);window.__timelines['stress']=tl;})();</script></template></body></html>
