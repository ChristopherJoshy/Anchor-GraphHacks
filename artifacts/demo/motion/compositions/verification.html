<!doctype html><html lang="en"><head><meta charset="UTF-8"><title>Execution is separate from checking persisted state</title></head><body><template><div id="verification" data-composition-id="verification" data-duration="18" class="scene" style="background:#17172a;color:var(--paper)"><div class="eyebrow"><span class="mark">A / ANCHOR</span><span>WHAT WOULD COUNT AS VERIFIED?</span><span>12 / 14</span></div><div class="words title" style="left:105px;top:155px;width:1710px;font-size:110px">A SUCCESS RESPONSE IS NOT ENOUGH.</div><div class="explanation setup" style="left:110px;top:290px;width:1600px">Simulated actions must be checked against what the mock ERP actually stored.</div><div class="card execute" style="left:110px;top:435px;width:450px;height:310px;background:#ffd447"><div class="node-title">1 / EXECUTE</div><div class="card-caption">Send the simulated action.</div><div class="action-slip">action response</div></div><div class="card persist" style="left:735px;top:435px;width:450px;height:310px;background:#28dce9"><div class="node-title">2 / PERSIST</div><div class="card-caption">Mock ERP saves state.</div><div class="stored-record">stored records</div></div><div class="card readback" style="left:1360px;top:435px;width:450px;height:310px;background:#92e5ad"><div class="node-title">3 / READ BACK</div><div class="card-caption">Read and compare facts.</div><div class="compare-record">expected ↔ stored</div></div><svg class="diagram" viewBox="0 0 1920 1080"><path class="write-line" d="M560 600H735" fill="none" stroke="#ffd447" stroke-width="10" stroke-linecap="round"/><path class="read-line" d="M1185 600H1360" fill="none" stroke="#28dce9" stroke-width="10" stroke-linecap="round"/><path class="return-line" d="M1580 775V850H960V775" fill="none" stroke="#92e5ad" stroke-width="10" stroke-linecap="round"/></svg><div class="packet write-packet write-packet-0" style="left:595px;top:580px"></div><div class="packet write-packet write-packet-1" style="left:595px;top:580px"></div><div class="packet write-packet write-packet-2" style="left:595px;top:580px"></div><div class="packet read-packet read-packet-0" style="left:1220px;top:580px"></div><div class="packet read-packet read-packet-1" style="left:1220px;top:580px"></div><div class="packet read-packet read-packet-2" style="left:1220px;top:580px"></div><div class="explanation principle" style="left:110px;top:920px;width:1600px">Only the comparison can establish whether the simulated outcome matches the plan.</div><div class="foot"><span>SYNTHETIC NETWORK / ORDERS / INCIDENTS / SIMULATION ONLY</span><span>EDITORIAL WORKFLOW / RECORDED PROOF FOLLOWS</span></div></div><script>(function(){const tl=gsap.timeline({paused:true});const base='#verification ';const A={pop(q,t,x=0,y=35,scale=.92){tl.fromTo(base+q,{x,y,opacity:0,scale},{x:0,y:0,opacity:1,scale:1,duration:.65,ease:'back.out(1.3)'},t)},count(q,n,t,d=1){tl.fromTo(base+q,{textContent:0},{textContent:n,snap:{textContent:1},duration:d,ease:'power2.out'},t)},draw(q,t,d=.7){document.querySelectorAll(base+q).forEach(p=>{const n=p.getTotalLength();tl.fromTo(p,{strokeDasharray:n,strokeDashoffset:n},{strokeDashoffset:0,duration:d,ease:'power2.out'},t)})}};A.pop('.title',.15,-100,0);A.pop('.setup',.5,0,25);A.pop('.execute',1,-120,0);A.pop('.action-slip',2,0,30);A.draw('.write-line',3,.5);A.pop('.persist',3.5,0,70);tl.fromTo(base+'.write-packet',{x:0,y:0,opacity:0},{x:90,y:0,opacity:1,duration:1.15,stagger:.2,repeat:2,repeatDelay:.35,ease:'none'},3.5);A.pop('.stored-record',5,0,35);A.draw('.read-line',6.2,.5);A.pop('.readback',7,120,0);tl.fromTo(base+'.read-packet',{x:0,y:0,opacity:0},{x:90,y:0,opacity:1,duration:1.15,stagger:.2,repeat:2,repeatDelay:.35,ease:'none'},7);A.pop('.compare-record',9,0,30);A.draw('.return-line',10,1.6);tl.to(base+'.stored-record,'+base+'.compare-record',{backgroundColor:'#ffd447',duration:.5,yoyo:true,repeat:3},11.7);A.pop('.principle',13.8,0,25);window.__timelines['verification']=tl;})();</script></template></body><
