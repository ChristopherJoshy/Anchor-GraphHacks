<!doctype html><html lang="en"><head><meta charset="UTF-8"><title>Make the 650-unit shortfall visible</title></head><body><template><div id="gap" data-composition-id="gap" data-duration="13" class="scene" style="background:#ffd447;"><div class="eyebrow"><span class="mark">A / ANCHOR</span><span>WHAT MUST RECOVERY COVER?</span><span>02 / 14</span></div><div class="words title" style="left:105px;top:155px;width:1710px;font-size:121px">350 HERE. 650 STILL MISSING.</div><div class="explanation setup" style="left:110px;top:300px;width:1600px">Each square represents 50 microcontrollers. Twenty squares fill the order.</div><div class="card demand-grid" style="left:110px;top:420px;width:1120px;height:440px;background:#fff3db"><div class="chip-grid demand"><i class="unit u0"></i><i class="unit u1"></i><i class="unit u2"></i><i class="unit u3"></i><i class="unit u4"></i><i class="unit u5"></i><i class="unit u6"></i><i class="unit u7"></i><i class="unit u8"></i><i class="unit u9"></i><i class="unit u10"></i><i class="unit u11"></i><i class="unit u12"></i><i class="unit u13"></i><i class="unit u14"></i><i class="unit u15"></i><i class="unit u16"></i><i class="unit u17"></i><i class="unit u18"></i><i class="unit u19"></i></div><div class="grid-key">20 × 50 = 1,000 units</div></div><div class="card gap-card" style="left:1320px;top:420px;width:490px;height:440px;background:#ff6654"><div class="metric-label">RECOVERY GAP</div><div class="metric gap-count">650</div><div class="card-caption">1,000 needed − 350 in stock</div></div><div class="explanation takeaway" style="left:110px;top:915px;width:1600px">Inventory covers 7 squares. Recovery has to supply the remaining 13.</div><div class="foot"><span>SYNTHETIC NETWORK / ORDERS / INCIDENTS / SIMULATION ONLY</span><span>EDITORIAL / EXACT ARITHMETIC</span></div></div><script>(function(){const tl=gsap.timeline({paused:true});const base='#gap ';const A={pop(q,t,x=0,y=35,scale=.92){tl.fromTo(base+q,{x,y,opacity:0,scale},{x:0,y:0,opacity:1,scale:1,duration:.65,ease:'back.out(1.3)'},t)},count(q,n,t,d=1){tl.fromTo(base+q,{textContent:0},{textContent:n,snap:{textContent:1},duration:d,ease:'power2.out'},t)},draw(q,t,d=.7){document.querySelectorAll(base+q).forEach(p=>{const n=p.getTotalLength();tl.fromTo(p,{strokeDasharray:n,strokeDashoffset:n},{strokeDashoffset:0,duration:d,ease:'power2.out'},t)})}};A.pop('.title',.15,-100,0);A.pop('.setup',.5,0,25);A.pop('.demand-grid',.8,0,70);tl.fromTo(base+'.unit',{scale:0,rotation:-30},{scale:1,rotation:0,duration:.35,stagger:.07,ease:'back.out(2)'},1.3);tl.to(base+'.unit:nth-child(-n+7)',{backgroundColor:'#92e5ad',duration:.3,stagger:.13},3);tl.to(base+'.unit:nth-child(n+8)',{backgroundColor:'#ff6654',duration:.3,stagger:.08},4.5);A.pop('.gap-card',5.6,140,0);A.count('.gap-count',650,5.9,1.2);A.pop('.takeaway',7.6,0,30);tl.to(base+'.unit:nth-child(n+8)',{y:-10,duration:.4,stagger:.06,yoyo:true,repeat:1},9);window.__timelines['gap']=tl;})();</script></template></body></html>
