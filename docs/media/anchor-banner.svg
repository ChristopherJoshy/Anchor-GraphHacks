<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc">
  <title id="title">Anchor: find the shared failure, recover with evidence</title>
  <desc id="desc">A conceptual diagram shows the primary supplier and two apparent backups depending on the same failed foundry. Anchor traces that exposure, computes a constrained recovery, and verifies simulated operational state.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#31504a" stroke-width="1"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#f4b183" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1600" height="650" rx="24" fill="#142e2b"/>
  <rect x="790" width="810" height="535" fill="url(#grid)" opacity=".38"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <circle cx="70" cy="69" r="20" fill="none" stroke="#f2eadd" stroke-width="2"/>
    <path d="M70 54V82M60 70H80M55 76Q70 94 85 76" fill="none" stroke="#f2eadd" stroke-width="2.5"/>
    <text x="108" y="79" fill="#f2eadd" font-size="32" font-weight="700">anchor.</text>
    <text x="52" y="145" fill="#f4b183" font-size="15" letter-spacing="3">RECOVERY FOR CONNECTED SUPPLY NETWORKS</text>
    <text x="50" y="240" fill="#fbf7ef" font-size="64" font-weight="700">Find the shared failure.</text>
    <text x="50" y="319" fill="#fbf7ef" font-size="64" font-weight="700">Recover with evidence.</text>
    <text x="54" y="381" fill="#c3d2cb" font-size="24">Different suppliers. One hidden dependency.</text>
    <text x="54" y="417" fill="#c3d2cb" font-size="24">A graph that changes the recovery decision.</text>
    <rect x="54" y="458" width="350" height="47" rx="23" fill="#f4b183"/>
    <text x="80" y="488" fill="#142e2b" font-size="18" font-weight="700">WATCH THE WORKING DEMO  ↗</text>
    <text x="906" y="84" fill="#adc1b7" font-size="15" letter-spacing="2">THREE SOURCES. ONE UPSTREAM FAILURE.</text>
    <g fill="#203e38" stroke="#5c7a6b" stroke-width="1.5">
      <rect x="892" y="135" width="232" height="78" rx="12"/>
      <rect x="892" y="257" width="232" height="78" rx="12"/>
      <rect x="892" y="379" width="232" height="78" rx="12"/>
    </g>
    <g fill="#f2eadd" font-size="23" font-weight="700">
      <text x="921" y="183">Primary supplier</text>
      <text x="921" y="305">Backup B</text>
      <text x="921" y="427">Backup C</text>
    </g>
    <g fill="none" stroke="#f4b183" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M1124 174H1190Q1215 174 1215 199V274H1270"/>
      <path d="M1124 296H1270"/>
      <path d="M1124 418H1190Q1215 418 1215 393V318H1270"/>
    </g>
    <rect x="1280" y="236" width="260" height="120" rx="14" fill="#472e2b" stroke="#f4a38b" stroke-width="2"/>
    <circle cx="1311" cy="268" r="7" fill="#f4a38b"/>
    <text x="1330" y="274" fill="#ffc4ad" font-size="15" font-weight="700" letter-spacing="2">OUTAGE</text>
    <text x="1308" y="318" fill="#fbf7ef" font-size="24" font-weight="700">Taiwan foundry</text>
    <text x="1140" y="493" fill="#adc1b7" font-size="16">DEPENDS_ON → upstream dependency</text>
    <path d="M52 550H1548" stroke="#40584f"/>
    <g fill="#f2eadd" font-size="20" font-weight="700">
      <text x="54" y="591">01  Trace the graph</text>
      <text x="545" y="591">02  Compute + challenge</text>
      <text x="1120" y="591">03  Act + read back</text>
    </g>
    <text x="54" y="625" fill="#9db4a7" font-size="14">FALKORDB  ·  OR-TOOLS  ·  MCP</text>
    <text x="1120" y="625" fill="#9db4a7" font-size="14">SYNTHETIC DATA · SIMULATION ONLY</text>
  </g>
</svg>
